// Elite Force (Marino's Build): Steam Deck / gamepad defaults.
// AppRun copies this file into ~/.local/share/eliteforce-marino/baseEF on the first
// Deck run of each mode and execs it once; after that the game's own config
// (efspconfig.cfg / hmconfig.cfg) keeps your changes. Delete the copy there (and the
// .deck-applied-* marker), or use Steam Deck Controls… in the launcher, to get these
// defaults back. Menus already work with the pad (A = select, B/Back = back, D-pad = move).
// Controller settings only: the display (fullscreen on the Deck) comes from the launcher
// and AppRun, so this file can be applied on any computer.

seta in_joystick "1"
seta in_joystickUseAnalog "1"
seta joy_threshold "0.15"

// left stick: move; right stick: look
bind PAD0_LEFTSTICK_UP "+forward"
bind PAD0_LEFTSTICK_DOWN "+back"
bind PAD0_LEFTSTICK_LEFT "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"
bind PAD0_RIGHTSTICK_LEFT "+left"
bind PAD0_RIGHTSTICK_RIGHT "+right"
bind PAD0_RIGHTSTICK_UP "+lookup"
bind PAD0_RIGHTSTICK_DOWN "+lookdown"
seta cl_yawspeed "200"
seta cl_pitchspeed "140"

// triggers: fire / alt-fire
bind PAD0_RIGHTTRIGGER "+attack"
bind PAD0_LEFTTRIGGER "+altattack"

// face buttons: jump, crouch (toggle), use, use held item
bind PAD0_A "+moveup"
bind PAD0_B "+movedown"
bind PAD0_X "+use"
bind PAD0_Y "+button2"

// bumpers: previous / next weapon; stick clicks: walk/run, re-center view
bind PAD0_LEFTSHOULDER "weapprev"
bind PAD0_RIGHTSHOULDER "weapnext"
bind PAD0_LEFTSTICK_CLICK "+speed"
bind PAD0_RIGHTSTICK_CLICK "centerview"

// D-pad: mission objectives, zoom, weapon slots 1 and 2
bind PAD0_DPAD_UP "+info"
bind PAD0_DPAD_DOWN "+zoom"
bind PAD0_DPAD_LEFT "weapon 1"
bind PAD0_DPAD_RIGHT "weapon 2"

// system buttons: menu, scoreboard / tricorder analysis
bind PAD0_START "togglemenu"
bind PAD0_BACK "+scores"

// back grips (L4/R4/L5/R5 appear as paddles when Steam Input passes them through)
bind PAD0_PADDLE1 "+altattack"
bind PAD0_PADDLE2 "+attack"
bind PAD0_PADDLE3 "+moveup"
bind PAD0_PADDLE4 "+use"
